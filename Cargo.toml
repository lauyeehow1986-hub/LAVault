[workspace]
resolver = "2"
members = [
    "crates/vault_core",
    "crates/desktop_daemon",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["LaVault Contributors"]

[workspace.dependencies]
aes = "0.8"
aes-gcm = "0.10"
aes-kw = { version = "0.2", features = ["alloc"] }
aes-siv = "0.7"
anyhow = "1.0"
argon2 = "0.5"
bip39 = "2.1"
chacha20poly1305 = "0.10"
ciborium = "0.2"
crc32fast = "1.4"
data-encoding = "2.6"
ed25519-dalek = { version = "2.1", features = ["rand_core", "zeroize"] }
getrandom = "0.2"
hex = "0.4"
hkdf = "0.12"
hmac = "0.12"
rand_core = "0.6"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11"
sha1 = "0.10"
sha2 = "0.10"
spake2 = "0.4"
tar = "0.4"
thiserror = "2.0"
tokio = { version = "1.41", features = ["full"] }
x25519-dalek = { version = "2.0", features = ["static_secrets", "zeroize"] }
xts-mode = "0.5"
zeroize = { version = "1.8", features = ["derive", "zeroize_derive"] }
zstd = "0.13"
